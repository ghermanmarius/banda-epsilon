.iconbtn[disabled] { opacity: .4; cursor: default; }

.val > span { font-size: 13px; font-weight: 600; color: var(--muted); }

.info b { color: var(--ink); }
.controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.seg { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 6px; }

.lamp small { font-size: 13px; color: var(--muted); line-height: 1.3; height: 2.6em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.avatar.sm { width: 18px; height: 18px; border-radius: 9px; font-size: 11px; letter-spacing: 0; }
.helpbar { background: var(--gold-soft); border-radius: 14px; padding: 10px 12px; font-size: 15px; }
.group { display: flex; flex-direction: column; gap: 8px; }

.acts { display: flex; gap: 10px; }

.gest { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
.gest svg { width: 36px; height: 36px; color: var(--rose); }

/* ecran de câștig */
.win { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-top: 18px; }
.bigcheck { width: 72px; height: 72px; border-radius: 36px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; }

.badgeNew { display: flex; gap: 10px; align-items: center; background: var(--gold-soft); border-radius: 14px; padding: 10px 12px; width: 100%; box-sizing: border-box; text-align: left; }
.badgeNew svg { width: 30px; height: 30px; color: var(--gold); flex-shrink: 0; }
.list { display: flex; flex-direction: column; gap: 8px; }
.trophy { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }

.scroller { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.scroller .btn { flex-shrink: 0; min-height: 40px; font-size: 14px; }

    bottom(nx ? `<button class="primary" id="play">${nx === 13 ? "Intră în Tribunal" : "Joacă nivelul " + num(nx)} ${I.arrow}</button>`

  // ============================================================ MOTORUL NIVELULUI
  function newSession(L, mode) {
    return { L, mode, Lc: L.L0, R: 50, hearts: mode === "expert" ? 1 : 3, lostHeart: false, help: false,

  }
  function startLevel(id) {

  }
  // Mod expert: șiruri la întâmplare, fără becuri, o singură viață
  function startExpert(solved) {

  function startLab() { G = newSession(Object.assign({}, lv(S.labId), { zoom: true, rival: null }), "lab"); go("level"); }

  const visEnd = () => G.R;
  // zoom pe axa n: câți termeni se văd (între 10 și 5000)

  function renderLevel() {

    bottom(`${canNo ? `<button class="secondary" id="noLim">Nu are limită</button>` : ""}<button class="primary" id="chk">Verifică</button>`);
    $("back").onclick = () => { G = null; go("map"); };
    $("how").onclick = howTo;
    if (canNo) $("noLim").onclick = askNoLimit;
    $("chk").onclick = doCheck;
    $("zOut").onclick = () => zoomStep(1); $("zIn").onclick = () => zoomStep(-1);
    document.querySelectorAll("[data-lab]").forEach(b => b.onclick = () => { S.labId = +b.dataset.lab; save(); startLab(); });
    if ($("labE")) $("labE").oninput = e => { G.labEps = +e.target.value; updateHud(); draw(); };
    if ($("shr")) $("shr").oninput = e => { if (G.busy) { e.target.value = G.shrink; return; } G.shrink = +e.target.value; if (Math.abs(G.shrink - 0.5) < 0.02) { if (G.shrink !== 0.5) buzz(8); G.shrink = 0.5; } draw(); };

  }

  function nudgeL(d) { if (G.busy) return; const L = G.L; G.Lc = Math.max(L.lo, Math.min(L.hi, G.Lc + d * span(L) * 0.01)); G.moved = true; snapL(0.0051); draw(); }
  function snapL(tol = 0.02) { const L = G.L; for (const s of L.snaps) if (Math.abs(G.Lc - s) < span(L) * tol) { if (G.Lc !== s) buzz(); G.Lc = s; return; } }

  function updateHud() {
    if ($("hearts")) { const max = G.mode === "expert" ? 1 : 3; $("hearts").innerHTML = Array.from({ length: max }, (_, i) => I.heart(i < G.hearts)).join(""); $("hearts").setAttribute("aria-label", `${G.hearts} din ${max} vieți`); }
    const w = $("wave");
    if (G.mode === "level") w.innerHTML = `<span class="lab">${G.L.world >= 2 ? "Unde e limita? Sau nu are?" : "Unde e limita?"}</span><span class="eps">banda jocului: ε = ${fmt(curEps(), 3)}</span>`;
    else if (G.mode === "expert") w.innerHTML = `<span class="lab">Fără becuri · rezolvate: ${G.solved}</span><span class="pill gold">record ${S.expertBest}</span>`;
    else w.innerHTML = `<span class="lab">Explorează liber, fără vieți</span><span class="eps">ε = ${fmt(curEps(), 4)}</span>`;
  }

  // ------------------------------------------------------------ canvas

  // foaie de matematică: pătrățele de 14 px, cu o linie ceva mai vizibilă la fiecare 5, aliniate la origine
  function paper(c, w, h, ox, oy, cell = 14) {

      c.strokeStyle = colors.grid; c.globalAlpha = major ? 1 : 0.5; c.lineWidth = 1; c.beginPath();
      for (let k = Math.floor(-ox / cell); k * cell + ox <= w; k++) { if ((k % 5 === 0) !== major) continue; const x = Math.round(ox + k * cell) + 0.5; c.moveTo(x, 0); c.lineTo(x, h); }
      for (let k = Math.floor(-oy / cell); k * cell + oy <= h; k++) { if ((k % 5 === 0) !== major) continue; const y = Math.round(oy + k * cell) + 0.5; c.moveTo(0, y); c.lineTo(w, y); }
      c.stroke();
    }
    c.globalAlpha = 1;
  }
  function axes(c, x0, xEnd, yAx, yTop, yBot, yLab) {
    c.strokeStyle = colors.axis; c.fillStyle = colors.axis; c.lineWidth = 1.4; c.beginPath();
    c.moveTo(x0, yAx); c.lineTo(xEnd - 2, yAx); c.moveTo(x0, yBot); c.lineTo(x0, yTop + 2); c.stroke();
    c.beginPath(); c.moveTo(xEnd, yAx); c.lineTo(xEnd - 8, yAx - 4); c.lineTo(xEnd - 8, yAx + 4); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(x0, yTop); c.lineTo(x0 - 4, yTop + 8); c.lineTo(x0 + 4, yTop + 8); c.closePath(); c.fill();
    c.font = "italic 14px 'Fira Sans', serif"; c.textAlign = "left";
    c.fillText("n", xEnd - 10, yAx - 8); c.fillText(yLab, x0 + 8, yTop + 9);
  }
  function halo(c, text, x, y) { c.lineWidth = 3; c.strokeStyle = colors.surf; c.strokeText(text, x, y); c.fillText(text, x, y); }
  function readColors() { const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
    colors = { band: g("--band"), edge: g("--band-edge"), rose: g("--rose"), roseInk: g("--rose-ink"), muted: g("--muted"), ink: g("--ink"),
      inC: g("--in"), out: g("--out"), surf: g("--surface"), grey: g("--grey"), gold: g("--gold"), grid: g("--grid"), axis: g("--axis") }; }
  function setupCanvas() {
    cv = $("cv"); ctx = cv.getContext("2d"); readColors();
    const resize = () => { const w = $("cw").clientWidth; CW = w; CH = Math.round(Math.min(340, Math.max(220, w * 0.68)));
      const dpr = window.devicePixelRatio || 1; cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr); cv.style.height = CH + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); if (!G.busy) draw(); };
    resize(); window.onresize = () => cv && document.body.contains(cv) && resize();

  }

  const Y = v => PAD.t + (G.L.hi - v) / span(G.L) * (CH - PAD.t - PAD.b);

  function draw(opts) {
    if (!ctx || !G || !document.body.contains(cv)) return;
    opts = opts || {};
    const L = G.L, R = opts.R || visEnd(), upto = opts.upto || R, eps = viewEps(), Lc = G.Lc;

    ctx.clearRect(0, 0, CW, CH);
    const pw = CW - PAD.l - PAD.r, y0 = PAD.t, y1 = CH - PAD.b;

    ctx.strokeStyle = colors.rose; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(PAD.l, Y(Lc)); ctx.lineTo(PAD.l + pw, Y(Lc)); ctx.stroke();
    if (shrinkF() !== 1 || G.animEps) { const ge = curEps(), gT = Math.max(y0 - 10, Y(Lc + ge)), gB = Math.min(y1 + 10, Y(Lc - ge));
      ctx.setLineDash([5, 4]); ctx.strokeStyle = colors.edge; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(PAD.l, gT); ctx.lineTo(PAD.l + pw, gT); ctx.moveTo(PAD.l, gB); ctx.lineTo(PAD.l + pw, gB); ctx.stroke(); ctx.setLineDash([]); }
    // axe, cu gradații
    axes(ctx, PAD.l, CW - 4, yAx, 4, CH - 4, "aₙ");
    ctx.font = "12px Outfit, sans-serif"; ctx.fillStyle = colors.muted; ctx.strokeStyle = colors.axis; ctx.lineWidth = 1.4; ctx.textAlign = "right";
    let lastY = -99; [...L.snaps].sort((a, b) => b - a).forEach(s => { const yy = Y(s); if (yy - lastY < 15) return; lastY = yy;
      ctx.strokeStyle = colors.axis; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(PAD.l - 4, yy); ctx.lineTo(PAD.l + 4, yy); ctx.stroke(); ctx.fillStyle = colors.muted; ctx.fillText(fmt(s, 2), PAD.l - 7, yy + 4); });
    const nt = [1, Math.round(R / 2), R], ly = yAx + 15;
    ctx.textAlign = "center"; nt.forEach(n => { const x = X(n, R); ctx.strokeStyle = colors.axis; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x, yAx - 4); ctx.lineTo(x, yAx + 4); ctx.stroke(); ctx.fillStyle = colors.muted; halo(ctx, String(n), x + (n === 1 ? 3 : 0), ly); });

      else { ctx.strokeStyle = colors.out; ctx.fillStyle = colors.surf; ctx.lineWidth = many ? 1.6 : 2; ctx.beginPath(); ctx.arc(x, y, many ? 2.4 : r - 0.6, 0, 7); ctx.fill(); ctx.stroke(); }
    }
    const tag = (n, text, col) => { const x = X(n, R), y = Math.max(y0 - 8, Math.min(y1 + 8, Y(L.a(n))));

      ctx.fillStyle = col; ctx.font = "600 13px Outfit, sans-serif"; const right = x > CW / 2; ctx.textAlign = right ? "right" : "left";

    if (opts.flash) tag(opts.flash, `a${sub(opts.flash)} e afară`, colors.out);
    if (G.tapK && !opts.R && G.tapK <= R) { const n = G.tapK, x = X(n, R), y = Math.max(y0 - 8, Math.min(y1 + 8, Y(L.a(n)))); ctx.strokeStyle = colors.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r + 5, 0, 7); ctx.stroke(); }
    // eticheta benzii
    ctx.font = "700 12.5px Outfit, sans-serif";
    const bl = `L = ${fmt(Lc)}`; const bw = ctx.measureText(bl).width + 16, by = Math.min(Math.max(Y(Lc), y0 + 9), y1 - 9);
    ctx.fillStyle = colors.rose; roundRect(CW - PAD.r - bw, by - 9, bw, 18, 9); ctx.fill();
    ctx.fillStyle = colors.roseInk; ctx.textAlign = "center"; ctx.fillText(bl, CW - PAD.r - bw / 2, by + 4.5);
    if (opts.scanX) { ctx.strokeStyle = colors.ink; ctx.globalAlpha = .35; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(opts.scanX, y0); ctx.lineTo(opts.scanX, y1); ctx.stroke(); ctx.globalAlpha = 1; }

  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function setLamp(id, on, text, label) { const el = $(id); el.classList.toggle("on", on); el.querySelector("small").textContent = text; el.setAttribute("aria-label", `${label}: ${on ? "aprins" : "stins"}. ${text}`); }

    setLamp("lampB", st.B, st.B ? (st.lastOut === 0 ? "Da: niciunul afară" : st.huge ? "Da: ultimul afară, foarte departe" : `Da: ultimul afară e a${sub(st.lastOut)}`) : "Nu: mereu rămân afară", "Becul B");
    if (G.tapK) { const v = L.a(G.tapK); $("info").innerHTML = `<b>a${sub(G.tapK)} = ${fmt(v, 4)}</b> · ${Math.abs(v - G.Lc) < eps ? "în bandă" : "afară"}`; }
    else $("info").innerHTML = `Din aceștia: <b>${nIn}</b> în bandă · <b>${nOut}</b> afară`;
    let t, cls = "";
    if (G.mode === "expert") t = G.moved ? "" : "Trage banda pe limită.";
    else if (!G.moved && G.mode !== "lab") t = "Trage banda pe limită.";
    else if (st.B) t = "Îngustează banda.";
    else if (st.A) { t = "Afară rămân mereu termeni."; cls = "warn"; }
    else t = "";
    const td = $("todo"); td.textContent = t; td.className = "todo " + cls;
  }

  function attachPointer() {
    let active = false, off = 0, sx = 0, sy = 0, moved = 0, pinch = null;
    const pts = new Map();
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    const spread = () => { const [a, b] = [...pts.values()]; return Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)); };
    cv.onpointerdown = e => {
      if (G.busy) return;
      try { cv.setPointerCapture(e.pointerId); } catch (er) {}
      const p = pos(e); pts.set(e.pointerId, p);
      if (pts.size === 2) { pinch = { d0: spread(), R0: G.R }; active = false; e.preventDefault(); return; }
      sx = p.x; sy = p.y; moved = 0; active = true; off = G.Lc - vAt(p.y);
      e.preventDefault();
    };
    cv.onpointermove = e => {
      if (pts.has(e.pointerId)) pts.set(e.pointerId, pos(e));
      if (pinch && pts.size === 2) { setR(pinch.R0 * pinch.d0 / spread()); return; }
      if (!active) return;
      const p = pos(e); moved = Math.max(moved, Math.abs(p.x - sx) + Math.abs(p.y - sy));
      if (moved < 4) return;
      G.tapK = null; G.Lc = Math.max(G.L.lo, Math.min(G.L.hi, vAt(p.y) + off)); G.moved = true; snapL();
      draw();
    };
    const end = e => {
      pts.delete(e.pointerId);
      if (pinch) { if (pts.size < 2) pinch = null; active = false; return; }
      if (!active) return;
      if (moved < 4) { const p = pos(e), R = visEnd(), n = Math.max(1, Math.min(R, nAt(p.x, R)));
        G.tapK = Math.abs(Y(G.L.a(n)) - p.y) < 18 ? n : null; draw(); }
      active = false;
    };
    cv.onpointerup = end; cv.onpointercancel = end;
    cv.onwheel = e => { if (!e.ctrlKey || G.busy) return; e.preventDefault(); setR(G.R * Math.exp(e.deltaY * 0.01)); };
    cv.onkeydown = e => {
      if (G.busy) return;
      if (e.key === "ArrowUp") nudgeL(1); else if (e.key === "ArrowDown") nudgeL(-1);
      else if (e.key === "Enter") doCheck(); else if (e.key === "+" || e.key === "=") zoomStep(-1); else if (e.key === "-") zoomStep(1); else return;
      e.preventDefault();
    };
  }

  // ------------------------------------------------------------ verificarea: L-ul ales este limita?
  // Jocul îngustează banda (animat) ca să arate de ce: la limita adevărată becul B rămâne aprins oricât de îngustă e banda;
  // la orice alt L, o bandă destul de îngustă îl stinge.
  function narrowTo(from, to, dur, done) {
    const t0 = performance.now(); dur = reduced() ? 0 : dur;
    const step = now => {
      const p = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 2);
      G.animEps = from * Math.pow(to / from, e);
      draw();
      $("todo").textContent = `Verific… ε = ${fmt(G.animEps, G.animEps < 0.01 ? 5 : 3)}`; $("todo").className = "todo";
      if (p < 1) requestAnimationFrame(step); else setTimeout(done, 350);
    };
    requestAnimationFrame(step);
  }
  function doCheck() {
    if (G.busy) return;
    const L = G.L, base = viewEps(), Lc = G.Lc;
    G.busy = true; G.tapK = null;
    const correct = L.ans !== null && Math.abs(Lc - L.ans) < 1e-9;
    const wasB = lamps(Lc, base).B;
    if (correct) return narrowTo(base, base / 200, 1400, () => onCorrect());
    const far = [...L.acc, ...(L.accInt || [])].map(c => Math.abs(c - Lc));
    const d = L.inf ? 2 * base : L.ans === null ? Math.max(...far) : Math.abs(Lc - L.ans);
    const target = Math.min(base, d / 2);
    narrowTo(base, target, target < base ? 1400 : 0, () => onWrong(target, wasB));
  }
  function onCorrect() {
    buzz(15);
    if (G.mode === "lab") return resultSheet("good", `Da: ${fmt(G.Lc)} este limita`, "Oricât de îngustă ar fi banda, becul B rămâne aprins.", "Înapoi la grafic", ready);
    if (G.mode === "expert") return expertSolved();
    resultSheet("good", `Corect: limita este ${fmt(G.Lc)}`, "Oricât de îngustă ar fi banda, becul B rămâne aprins: afară sunt doar finit de mulți termeni.", "Continuă", winLevel);
  }
  function onWrong(eps, wasB) {
    const L = G.L;
    const why = L.ans === null
      ? (L.inf ? "Termenii cresc peste orice valoare, deci depășesc orice bandă: becul B e stins oriunde ai pune-o." : `Cu banda de ε = ${fmt(eps, eps < 0.01 ? 5 : 3)}, becul B se stinge: afară rămân termeni la nesfârșit. De fapt, oriunde ai pune banda, se întâmplă la fel.`)
      : `Cu banda de ε = ${fmt(eps, eps < 0.01 ? 5 : 3)}, becul B se stinge: afară rămân termeni la nesfârșit.`;
    const extra = wasB ? " La banda de la început becul B era aprins, dar o singură bandă nu ajunge: limita trebuie să țină la orice bandă." : "";
    if (G.mode === "lab") return resultSheet("bad", `Nu: ${fmt(G.Lc)} nu este limita`, why + extra, "Înapoi la grafic", ready);
    buzz(40);
    G.hearts--; G.lostHeart = true; updateHud();
    if (G.mode === "expert") return expertOver();
    if (G.hearts <= 0) { G.busy = false; G.animEps = null; S.failStreak++; save(); return go("lost"); }
    resultSheet("bad", `${fmt(G.Lc)} nu este limita. −1 viață`, `${why}${extra}<br><br><b>Indiciu:</b> ${L.hint}`, "Încearcă din nou", ready);
  }
  const ready = () => { G.busy = false; G.animEps = null; updateHud(); draw(); };

  function resultSheet(kind, title, text, btn, onGo) {
    const ic = kind === "good" ? I.check : kind === "bad" ? I.x : I.bolt;
    let done = false; const fire = () => { if (done) return; done = true; onGo(); };
    openSheet(`<div class="result ${kind}"><span class="ic">${ic}</span><div><h3>${title}</h3>${text ? `<p style="margin-top:4px">${text}</p>` : ""}</div></div>
      <button class="primary" id="sgo" style="flex:none">${btn}</button>`, fire);
    $("sgo").onclick = () => { closeSheet(); fire(); };
  }

  function askNoLimit() {
    if (G.busy) return;
    openSheet(`<h3>Șirul nu are limită?</h3><p>Asta înseamnă că, oricare ar fi <span class="m">L</span>, o bandă destul de îngustă lasă becul B stins: afară rămân termeni la nesfârșit.</p>
      <div class="acts"><button class="secondary" id="nc" style="flex:1">Anulează</button><button class="primary rose" id="ny">Da, nu are limită</button></div>`);
    $("nc").onclick = closeSheet;
    $("ny").onclick = () => { closeSheet(); declareNoLimit(); };
  }
  function declareNoLimit() {
    const L = G.L;
    G.busy = true; G.shrink = 0.5;
    if (L.ans === null) {
      if (G.mode === "expert") return expertSolved();
      // reluare: banda mătură toate valorile; becul A se aprinde în mai multe locuri, becul B niciodată
      const t0 = performance.now(), dur = reduced() ? 0 : 3200;
      G.animEps = Math.min(curEps(), span(L) * 0.04);
      const step = now => {
        const p = dur ? Math.min(1, (now - t0) / dur) : 1;
        G.Lc = L.lo + span(L) * (0.04 + 0.92 * p);
        draw();
        $("todo").textContent = "Becul B rămâne stins oriunde.";
        if (p < 1) requestAnimationFrame(step); else setTimeout(winLevel, 500);
      };
      return requestAnimationFrame(step);
    }
    buzz(40);
    G.hearts--; G.lostHeart = true; updateHud();
    if (G.mode === "expert") return expertOver();
    if (G.hearts <= 0) { G.busy = false; S.failStreak++; save(); return go("lost"); }
    resultSheet("bad", "Acest șir are limită. −1 viață", `Există o valoare la care becul B rămâne aprins oricât de îngustă e banda. Caut-o.<br><br><b>Indiciu:</b> ${L.hint}`, "Înapoi la nivel", ready);
  }

  // ------------------------------------------------------------ rival, ajutor
  function showRival() {
    const r = G.L.rival;
    openSheet(`<div class="rival"><span class="avatar">${r.who[0]}</span><div><b>${r.who}</b><p>„${r.text}”</p></div></div>
      <p>Banda ta pornește de la propunerea lui: <span class="m">L</span> = −0,05. Este chiar limita?</p>
      <button class="primary" id="ok" style="flex:none">Să vedem</button>`);
    $("ok").onclick = closeSheet;
  }
  function offerHelp() {
    openSheet(`<h3>Vrei ajutor?</h3><p>Ai pierdut ultimele două încercări. Cu ajutor, vezi indiciul nivelului de la început. Nivelul se câștigă la fel, dar fără a treia stea.</p>
      <div class="acts"><button class="secondary" id="hn" style="flex:1">Fără ajutor</button><button class="primary" id="hy">Folosește ajutorul</button></div>`, () => G.L.rival && showRival());
    $("hn").onclick = () => { closeSheet(); if (G.L.rival) showRival(); };
    $("hy").onclick = () => { G.help = true; closeSheet(); renderLevel(); if (G.L.rival) showRival(); };
  }

  // ------------------------------------------------------------ câștig / pierdere
  let lastWin = null;
  function winLevel() {
    const L = G.L;
    if (!G.lostHeart) S.tight[L.id] = true;
    S.stars[L.id] = 1;
    S.failStreak = 0;
    const newBadges = awardBadges(); save();
    lastWin = { id: L.id, lesson: L.lesson, Lc: G.Lc, kind: L.ans === null ? "nolim" : "lim", newBadges };
    G.busy = false; closeSheet();
    go("win");
  }
  function renderWin() {
    const w = lastWin, nx = nextLevel();
    $("screen").innerHTML = `<div class="win">
      <span class="eyebrow">${w.id === 13 ? "Tribunalul" : "Nivelul " + num(w.id)} câștigat</span>
      <span class="bigcheck" aria-hidden="true">${I.check}</span>
      <div class="kv">${w.kind === "trib" ? `<b>Definiția corectă: B</b>` : w.kind === "nolim" ? `<b>Șirul nu are limită</b>` : `<span>Limita: <span class="m">L</span> = <b>${fmt(w.Lc)}</b></span>`}</div>
      <div class="card"><h3>Ce ai aflat</h3><p>${w.lesson}</p></div>
      ${w.newBadges.map(id => `<div class="badgeNew">${I.medal}<span><b>Trofeu nou: ${BADGES.find(x => x.id === id).name}</b></span></div>`).join("")}
      </div>`;
    bottom(`<button class="secondary" id="again">Rejoacă</button><button class="primary" id="next">${nx ? (nx === 13 ? "Tribunalul" : "Nivelul următor") : (S.tribunal ? "Harta" : "Harta")} ${I.arrow}</button>`);
    $("again").onclick = () => startLevel(w.id);
    $("next").onclick = () => nx ? startLevel(nx) : go("map");
  }
  function renderLost() {
    const L = G.L;
    $("screen").innerHTML = `<div class="win"><span class="eyebrow">Nivelul ${num(L.id)}</span><div class="hearts" style="gap:8px">${[0, 1, 2].map(() => I.heart(false, 'style="width:44px;height:44px"')).join("")}</div>
      <h2>Ai rămas fără vieți</h2><div class="card"><h3>Indiciu</h3><p>${L.hint}</p></div>
      ${S.failStreak >= 2 ? `<p class="muted">La următoarea încercare îți oferim ajutor.</p>` : ""}</div>`;
    bottom(`<button class="secondary" id="map">Harta</button><button class="primary" id="retry">Încearcă din nou</button>`);
    $("map").onclick = () => go("map"); $("retry").onclick = () => startLevel(L.id);
  }

  // ============================================================ TRIBUNALUL
  let T = null;
  const RIGHT = { q1: "da", q2: "nu", vote: "B" };
  function renderTribunal() {
    T = T || { q1: null, q2: null, vote: null, wrong: 0 };
    const osc = lv(9);
    const fb = (q, good, bad) => T[q] ? `<div class="fb ${T[q] === RIGHT[q] ? "good" : "bad"}">${T[q] === RIGHT[q] ? good : bad}</div>` : "";
    const qBtn = (q, v, label) => { const ch = T[q] === v; return `<button class="btn ${ch ? (RIGHT[q] === v ? "right" : "wrong") : ""}" data-q="${q}" data-v="${v}" aria-pressed="${ch}">${label}</button>`; };
    $("screen").innerHTML = `
      <div class="top"><button class="iconbtn" id="back" aria-label="Înapoi la hartă">${I.back}</button>
        <div class="t"><h2>Tribunalul</h2><small>Cine are dreptate?</small></div></div>
      <p>Doi elevi propun câte o definiție a limitei. Tu decizi care rămâne, folosind ce ai aflat la nivelurile „Are sau nu are?”.</p>
      <div class="card"><div class="def"><span class="avatar">A</span><p><b>Ana:</b> „<span class="m">L</span> e limita dacă <b>orice</b> bandă în jurul lui <span class="m">L</span> conține <b>o infinitate</b> de termeni.”</p></div>
        <div class="def"><span class="avatar b">B</span><p><b>Bogdan:</b> „<span class="m">L</span> e limita dacă <b>orice</b> bandă în jurul lui <span class="m">L</span> lasă afară <b>doar finit de mulți</b> termeni.”</p></div></div>
      <h3>Dovada: șirul de la nivelul 9, <span class="m">${osc.f}</span>, cu banda pe 1</h3>
      <div class="canvasWrap"><canvas id="tcv" role="img" aria-label="Șirul oscilant cu banda în jurul lui 1: termenii pari sunt în bandă, cei impari afară, lângă −1."></canvas></div>
      <div class="group"><p><b>1.</b> După Ana, este 1 limita acestui șir?</p>
        <div class="opts">${qBtn("q1", "da", "Da")}${qBtn("q1", "nu", "Nu")}</div>
        ${fb("q1", "Da: în orice bandă în jurul lui 1 sunt infinit de mulți termeni (cei pari). Deci, după Ana, 1 este limita.", "Uită-te în bandă: câți termeni sunt înăuntru, dacă șirul continuă la nesfârșit?")}</div>
      ${T.q1 === "da" ? `<div class="group"><p><b>2.</b> După Bogdan, este 1 limita acestui șir?</p>
        <div class="opts">${qBtn("q2", "da", "Da")}${qBtn("q2", "nu", "Nu")}</div>
        ${fb("q2", "Nu: afară rămân infinit de mulți termeni (cei impari). Deci, după Bogdan, 1 nu este limita.", "Uită-te afară: câți termeni rămân în afara benzii?")}</div>` : ""}
      ${T.q2 === "nu" ? `<div class="card"><p>La nivelul 9 ai aflat că <b>șirul nu are limită</b>. Mai mult, după Ana și −1 ar fi limită, iar un șir nu poate avea două limite.</p></div>
        <div class="group"><p><b>3.</b> Care enunț este definiția limitei?</p><div class="opts">${qBtn("vote", "A", "A · Ana")}${qBtn("vote", "B", "B · Bogdan")}</div>
        ${fb("vote", "Corect: definiția B. Dacă afară rămân doar finit de mulți termeni, există un ultim termen afară, iar de la următorul, <span class=\"m\">N</span>, toți sunt în bandă: exact definiția ε–N.", "Ana descrie un punct de acumulare, nu limita: după ea, șirul de la nivelul 9 ar avea două „limite”, 1 și −1.")}</div>` : ""}`;
    const done = T.vote === "B";
    bottom(done ? `<button class="primary" id="fin">Închide procesul ${I.arrow}</button>` : `<button class="secondary" id="toMap">Harta</button><button class="primary" disabled>Răspunde la întrebări</button>`);
    $("back").onclick = () => { T = null; go("map"); };
    if (done) {
      $("fin").onclick = () => {
        S.tribunal = true;
        const newBadges = awardBadges(); save();
        lastWin = { id: 13, kind: "trib", lesson: "Definiția B este definiția limitei. Definiția A descrie un punct de acumulare. Încearcă acum Modul expert sau Laboratorul.", newBadges };
        T = null; go("win");
      };
    } else $("toMap").onclick = () => { T = null; go("map"); };
    document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
      const q = b.dataset.q, v = b.dataset.v; if (T[q]) return;
      T[q] = v;
      if (v !== RIGHT[q]) { T.wrong++; buzz(40); setTimeout(() => { if (T) { T[q] = null; if (screen === "tribunal") render(); } }, 2200); }
      const y = window.scrollY; render(); window.scrollTo(0, y);
    });
    // dovada: șirul 9 cu banda în jurul lui 1
    const c = $("tcv"), cx = c.getContext("2d"), w = c.parentElement.clientWidth, h = 180, dpr = window.devicePixelRatio || 1;
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.height = h + "px"; cx.setTransform(dpr, 0, 0, dpr, 0, 0); readColors();
    const Yt = v => 20 + (2.4 - v) / 4.8 * (h - 30), Xt = n => 34 + n / 41 * (w - 50);
    paper(cx, w, h, 34, Yt(0));
    cx.globalAlpha = .85; cx.fillStyle = colors.band; cx.fillRect(34, Yt(1.4), w - 50, Yt(0.6) - Yt(1.4)); cx.globalAlpha = 1;
    cx.strokeStyle = colors.rose; cx.lineWidth = 2.4; cx.beginPath(); cx.moveTo(34, Yt(1)); cx.lineTo(w - 16, Yt(1)); cx.stroke();
    axes(cx, 34, w - 4, Yt(0), 4, h - 4, "aₙ");
    cx.font = "12px Outfit, sans-serif"; cx.fillStyle = colors.muted; cx.textAlign = "right"; [1, -1].forEach(v => cx.fillText(fmt(v), 27, Yt(v) + 4));
    for (let n = 1; n <= 40; n++) { const v = osc.a(n), x = Xt(n), y = Yt(v);
      if (Math.abs(v - 1) < 0.4) { cx.fillStyle = colors.inC; cx.beginPath(); cx.arc(x, y, 3.6, 0, 7); cx.fill(); }
      else { cx.strokeStyle = colors.out; cx.fillStyle = colors.surf; cx.lineWidth = 2; cx.beginPath(); cx.arc(x, y, 3, 0, 7); cx.fill(); cx.stroke(); } }
  }

  // ============================================================ TROFEE + COLECȚIA DE ȘIRURI
  function renderTrophies() {
    const wonL = LEVELS.filter(l => won(l.id));
    $("screen").innerHTML = `
      <div class="top"><button class="iconbtn" id="back" aria-label="Înapoi la hartă">${I.back}</button><div class="t"><h2>Trofee</h2><small>${S.badges.length} din ${BADGES.length}</small></div></div>
      <div class="list">${BADGES.map(b => `<div class="trophy ${S.badges.includes(b.id) ? "" : "off"}">${I.medal}<span><b>${b.name}</b><small>${b.how}</small></span></div>`).join("")}</div>
      <h3 style="margin-top:6px">Colecția de șiruri</h3>
      ${wonL.length ? `<div class="list">${wonL.map(l => `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>Nivelul ${num(l.id)}</b></div>
        <span class="m">${l.f}</span><span>${l.ans === null ? "Nu are limită" : "Limita: " + fmt(l.ans)}</span><small class="muted">${l.lesson}</small></div>`).join("")}</div>`
        : `<p class="muted">Fiecare nivel câștigat adaugă aici o fișă cu șirul și ce ai aflat.</p>`}`;
    bottom(`<button class="primary" id="map">Harta</button>`);
    $("back").onclick = () => go("map"); $("map").onclick = () => go("map");
  }

  render();
  try { document.fonts && document.fonts.ready.then(() => { if (screen === "level" && G && !G.busy) draw(); }); } catch (e) {}
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); if (!(G && G.busy)) render(); }); } catch (e) {}
})();
</script>
</body>
</html>
